<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Lunneta ✨</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
            background: linear-gradient(180deg, #3d4db7 0%, #5b3d99 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .screen {
            display: none;
            width: 100%;
            height: 100vh;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            animation: fadeIn 0.6s ease-in;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Character Avatar */
        .character {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            padding: 5px;
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.6);
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        .character-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .character-inner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .character-emoji {
            font-size: 70px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Title */
        .title {
            color: white;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 30px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.3);
            letter-spacing: 1px;
        }

        /* Dialog Box */
        .dialog-box {
            background: rgba(79, 93, 149, 0.9);
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 25px;
            padding: 30px 35px;
            max-width: 400px;
            width: 90%;
            min-height: 150px;
            position: relative;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
        }

        .dialog-text {
            color: white;
            font-size: 18px;
            line-height: 1.6;
            text-align: center;
            font-weight: 500;
            min-height: 80px;
            white-space: pre-wrap;
        }

        .dialog-text.left {
            text-align: left;
        }

        /* Buttons */
        .button-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
        }

        .btn {
            padding: 12px 35px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Quicksand', sans-serif;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #0099ff);
            color: white;
        }

        .btn-secondary {
            background: linear-gradient(135deg, #ff6b9d, #ff1744);
            color: white;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 20px rgba(0,0,0,0.4);
        }

        .btn:active {
            transform: translateY(-1px);
        }

        /* Stars Grid */
        .stars-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            margin-top: 30px;
        }

        .star-item {
            font-size: 70px;
            cursor: pointer;
            transition: all 0.3s ease;
            filter: grayscale(100%) brightness(0.5);
            user-select: none;
        }

        .star-item:hover {
            transform: scale(1.2) rotate(20deg);
        }

        .star-item.active {
            filter: grayscale(0%) brightness(1);
            animation: starBurst 0.6s ease;
        }

        @keyframes starBurst {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.5) rotate(180deg); }
            100% { transform: scale(1) rotate(360deg); }
        }

        /* Continue Button */
        .continue-btn {
            display: none;
            padding: 15px 50px;
            font-size: 18px;
            font-weight: 700;
            background: linear-gradient(135deg, #a8e063, #56ab2f);
            color: white;
            border: none;
            border-radius: 50px;
            margin-top: 30px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            font-family: 'Quicksand', sans-serif;
        }

        .continue-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .continue-btn.show {
            display: inline-block;
            animation: popIn 0.5s ease;
        }

        @keyframes popIn {
            0% { transform: scale(0); }
            60% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Envelope Animation */
        .envelope-wrapper {
            position: relative;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .envelope-wrapper:hover {
            transform: scale(1.05);
        }

        .envelope {
            width: 200px;
            height: 140px;
            position: relative;
        }

        .envelope-flap {
            position: absolute;
            width: 0;
            height: 0;
            border-left: 100px solid transparent;
            border-right: 100px solid transparent;
            border-bottom: 70px solid #ffc0d9;
            top: 0;
            left: 0;
            transform-origin: top;
            transition: transform 0.6s ease;
        }

        .envelope-body {
            position: absolute;
            width: 200px;
            height: 120px;
            background: #ffe0eb;
            border-radius: 0 0 15px 15px;
            top: 70px;
            border: 3px solid #ff69b4;
        }

        .envelope-heart {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40px;
            animation: heartBeat 1.5s ease infinite;
        }

        @keyframes heartBeat {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            25% { transform: translate(-50%, -50%) scale(1.1); }
        }

        .envelope-wrapper.open .envelope-flap {
            transform: rotateX(180deg);
        }

        .envelope-wrapper.open {
            animation: envelopeOut 0.8s ease forwards;
        }

        @keyframes envelopeOut {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.7; }
            100% { transform: scale(0); opacity: 0; }
        }

        .envelope-text {
            color: white;
            font-size: 20px;
            font-weight: 600;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
        }

        /* WhatsApp Button */
        .wa-button {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 18px 45px;
            background: #25D366;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: 20px;
            font-weight: 700;
            box-shadow: 0 10px 30px rgba(37, 211, 102, 0.4);
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .wa-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(37, 211, 102, 0.6);
        }

        /* Typing cursor */
        .typing-cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: white;
            margin-left: 3px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        /* Confetti */
        .confetti {
            position: fixed;
            top: -20px;
            width: 10px;
            height: 10px;
            animation: confettiFall 3s linear;
            pointer-events: none;
        }

        @keyframes confettiFall {
            to {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Loading animation */
        .loading-dots {
            display: inline-block;
        }

        .loading-dots span {
            animation: loadingDot 1.4s infinite;
        }

        .loading-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes loadingDot {
            0%, 60%, 100% { opacity: 0; }
            30% { opacity: 1; }
        }

        /* Gift choice screen */
        .gift-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: giftFloat 2s ease-in-out infinite;
        }

        @keyframes giftFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }
    </style>
</head>

        let currentScreen = 1;

        function showScreen(screenNumber) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));

            currentScreen = screenNumber;

        function createConfetti() {
            const colors = ['#ff6b9d', '#c44569', '#f8b500', '#4bcffa', '#0fbcf9', '#ffa502', '#ff6348'];
            for (let i = 0; i < 60; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDelay = Math.random() * 2 + 's';
                    confetti.style.width = (Math.random() * 10 + 5) + 'px';
                    confetti.style.height = confetti.style.width;
                    document.body.appendChild(confetti);
                    setTimeout(() => confetti.remove(), 3000);
                }, i * 30);
            }
        }

        // Typing animation function
        function typeText(elementId, text, speed = 50, callback = null) {
            const element = document.getElementById(elementId);
            let index = 0;
            element.textContent = '';
            
            function type() {
                if (index < text.length) {
                    element.textContent += text.charAt(index);
                    index++;
                    setTimeout(type, speed);
                } else if (callback) {
                    callback();
                }
            }
            type();
        }
